<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PC-Bridge</title>
<style>
  :root {
    --card: rgba(20, 20, 26, 0.55);
    --card-2: rgba(13, 13, 17, 0.6);
    --line: rgba(255, 255, 255, 0.07);
    --line-hi: rgba(255, 255, 255, 0.12);
    --text: #ececf1;
    --muted: #8b8b98;
    --accent: #6c8cff;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0a0a0e; overflow: hidden; }
  body {
    color: var(--text);
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  .app-shell {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    background: linear-gradient(180deg, #101014 0%, #0a0a0e 100%);
    border-radius: var(--radius);
    overflow: hidden;
  }

  /* ---------- custom title bar ---------- */
  .titlebar {
    height: 44px; flex: 0 0 44px; display: flex; align-items: center;
    padding: 0 6px 0 14px; user-select: none;
    border-bottom: 1px solid var(--line);
    background: #101014;
  }
  .drag {
    flex: 1; align-self: stretch; display: flex; align-items: center; gap: 16px;
    min-width: 0; cursor: default; -webkit-app-region: no-drag;
  }
  .tb-status { display: flex; align-items: center; gap: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background .2s, box-shadow .2s; }
  .dot.on { background: var(--green); box-shadow: 0 0 9px var(--green); }
  .dot.off { background: var(--red); box-shadow: 0 0 9px var(--red); }
  .dot.wait { background: var(--amber); box-shadow: 0 0 9px var(--amber); }

  .tb-btn {
    width: 36px; height: 28px; border-radius: 8px; margin-left: 4px; display: grid; place-items: center;
    color: #a8a8b8; font-size: 13px; line-height: 1;
    transition: background .12s, color .12s, box-shadow .12s;
  }
  .tb-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
  .tb-btn.active { color: #9db4ff; }
  .tb-btn.min:hover {
    background: rgba(251, 191, 36, .16);
    color: var(--amber);
    box-shadow: inset 0 0 0 1px rgba(251, 191, 36, .38), 0 0 14px -4px rgba(251, 191, 36, .5);
  }
  .tb-btn.close:hover { background: rgba(248, 113, 113, .18); color: #ffb4b4; box-shadow: inset 0 0 0 1px rgba(248,113,113,.4); }

  /* ---------- content ---------- */
  .content { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 14px; }

  .card {
    flex: 0 0 auto; min-height: 0;
    background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px;
  }
  .card h2 {
    margin: 0 0 11px; font-size: 11px; letter-spacing: .9px; text-transform: uppercase;
    color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  .card h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; color: #5d5d6b; font-size: 11px; }

  textarea {
    width: 100%; min-height: 92px; resize: none; padding: 11px 13px;
    border-radius: 11px; border: 1px solid var(--line); background: rgba(5,5,8,.65);
    color: var(--text); font: 12.5px/1.6 "Cascadia Mono", "Consolas", monospace;
    outline: none; word-break: break-all;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.14) transparent;
  }
  /* WebView2 paints the resize corner and the scrollbar junction white otherwise. */
  ::-webkit-scrollbar-corner { background: transparent; }
  textarea::-webkit-resizer { display: none; }
  textarea:focus { border-color: rgba(108,140,255,.45); }

  .row { display: flex; gap: 10px; row-gap: 9px; flex-wrap: wrap; align-items: center; }
  .btn {
    padding: 8px 13px; border-radius: 10px; background: rgba(255,255,255,.06);
    border: 1px solid var(--line); color: var(--text); font-size: 12.5px;
    transition: background .15s, border-color .15s, transform .08s;
  }
  .btn:hover { background: rgba(255,255,255,.11); border-color: var(--line-hi); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: linear-gradient(180deg, #6c8cff, #5573e6); border-color: rgba(160,180,255,.55); color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.ghost { background: transparent; }
  .btn.danger { border-color: rgba(248,113,113,.28); color: #ffb4b4; background: rgba(248,113,113,.07); }
  .btn.danger:hover { background: rgba(248,113,113,.14); }

  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 9px; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { background: rgba(6,6,9,.55); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; min-width: 0; }
  .stat .k { color: var(--muted); font-size: 10.5px; letter-spacing: .55px; text-transform: uppercase; }
  .stat .v { margin-top: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .stat .v.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mono { font-family: "Cascadia Mono", "Consolas", monospace; font-size: 12px; }

  .journal {
    display: flex; flex-direction: column; gap: 1px; height: 268px; max-height: 268px; min-height: 0;
    overflow-y: auto; overflow-x: hidden; contain: content;
    font-family: "Cascadia Mono", "Consolas", monospace;
  }
  .entry {
    display: flex; align-items: baseline; gap: 9px; flex: 0 0 auto;
    padding: 3px 7px; border-radius: 7px; font-size: 12px; line-height: 1.55;
    white-space: nowrap; overflow: hidden; color: #c9c9d6;
  }
  .entry:hover { background: rgba(255,255,255,.04); }
  .entry .t { flex: 0 0 66px; color: #4d4d5c; font-size: 11px; }
  .entry .g { flex: 0 0 13px; text-align: center; font-size: 11px; color: var(--muted); }
  .entry .m { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* A long command or path used to blow the row up and push the panel around. */
  .entry.long { align-items: flex-start; white-space: normal; }
  .entry.long .m {
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
    max-height: 6.4em; text-overflow: clip;
  }

  /* stage header: the "этап" of the work */
  .entry.stage {
    margin: 7px 0 2px; padding: 6px 8px; border-radius: 8px;
    background: rgba(108,140,255,.09); border-left: 2px solid var(--accent);
    color: #dfe5ff; font-weight: 600; white-space: normal;
  }
  .entry.stage:first-child { margin-top: 0; }
  .entry.stage .t { flex: 0 0 66px; color: #6a7ab5; }
  .entry.stage .g { color: var(--accent); }
  /* steps, results, errors */
  .entry.step { padding-left: 24px; }
  .entry.step .g { color: #9db4ff; }
  .entry.step .m { color: #cfd3e6; }
  .entry.result .g { color: var(--green); }
  .entry.result .m { color: #c8f5e0; }
  .entry.error { background: rgba(248,113,113,.07); }
  .entry.error .g { color: var(--red); }
  .entry.error .m { color: #ffc9c9; }
  .entry.note .g { color: var(--amber); }
  .entry.shell .g, .entry.tunnel .g { color: #7dd3fc; }
  .entry.gui .g { color: #c4b5fd; }
  .entry.ui .g { color: #93c5fd; }
  .entry.key .g, .entry.admin .g { color: #fca5a5; }
  .entry.agent .g { color: #a3e635; }
  .entry.relay .g { color: #7dd3fc; }

  .stage-chip { max-width: 320px; color: #9db4ff; }
  .stage-chip .stage-mark { color: var(--accent); }
  .stage-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .shot-wrap { margin-top: 11px; display: none; }
  .shot-wrap.show { display: block; }
  .shot-wrap img { width: 100%; border-radius: 10px; border: 1px solid var(--line); }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 16px);
    background: rgba(24,24,32,.96); border: 1px solid var(--line-hi); color: var(--text);
    padding: 9px 15px; border-radius: 11px; font-size: 12.5px; opacity: 0;
    transition: opacity .18s, transform .18s; pointer-events: none; max-width: 80vw;
    box-shadow: 0 12px 40px -14px #000;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .spacer { flex: 1; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="titlebar">
    <div class="drag" id="dragZone">
      <div class="tb-status">
        <span class="chip"><span class="dot wait" id="agentDot"></span><span id="agentLabel">запуск…</span></span>
        <span class="chip"><span class="dot wait" id="tunnelDot"></span><span id="tunnelLabel">туннель…</span></span>
        <span class="chip stage-chip" id="stageChip" hidden><span class="stage-mark">▸</span><span id="stageLabel"></span></span>
      </div>
    </div>
    <button class="tb-btn min" id="tbMin" title="Свернуть">─</button>
    <button class="tb-btn close" id="tbClose" title="Свернуть в трей">✕</button>
  </div>

  <div class="content">
    <section class="card">
      <h2>Ключ подключения</h2>
      <textarea id="pairing" readonly spellcheck="false"></textarea>
      <div class="row" style="margin-top:16px">
        <button class="btn primary" id="copyBtn">Копировать ключ + промпт</button>
        <button class="btn" id="copyKeyBtn">Ключ</button>
        <button class="btn ghost" id="revealBtn">Показать ключ</button>
        <button class="btn ghost" id="rotateBtn">Новый ключ</button>
        <button class="btn ghost" id="tunnelBtn">Обновить туннель</button>
      </div>
    </section>

    <section class="card">
      <h2>Состояние</h2>
      <div class="grid">
        <div class="stat"><div class="k">Туннель</div><div class="v mono clip" id="sTunnel" title="">—</div></div>
        <div class="stat"><div class="k">Локальный релей</div><div class="v mono" id="sPort">—</div></div>
        <div class="stat"><div class="k">Работает</div><div class="v" id="sUptime">—</div></div>
      </div>
      <div class="row" style="margin-top:11px">
        <button class="btn" id="pauseBtn">Пауза</button>
        <button class="btn" id="shotBtn">Скриншот</button>
        <button class="btn ghost" id="folderBtn">Папка данных</button>
        <div class="spacer"></div>
        <button class="btn danger" id="quitBtn">Закрыть совсем</button>
      </div>
      <div class="shot-wrap" id="shotWrap"><img id="shotImg" alt="скриншот экрана" /></div>
    </section>

    <section class="card">
      <h2>Журнал действий</h2>
      <div class="journal" id="journal"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const appWindow = window.__TAURI__.window.getCurrentWindow();

  const $ = (id) => document.getElementById(id);
  let state = null;
  let journalEntries = [];
  let keyVisible = false;
  let dragging = false;
  let toastTimer = null;

  function toast(message) {
    const node = $("toast");
    node.textContent = message;
    node.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => node.classList.remove("show"), 3000);
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  function formatUptime(seconds) {
    const total = Math.max(0, Math.floor(seconds || 0));
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    if (h) return `${h} ч ${m} мин`;
    if (m) return `${m} мин ${s} с`;
    return `${s} с`;
  }

  // ---------------------------------------------------------------- window controls
  // Native drag: one Win32 call on mousedown instead of a JS-driven loop, which is
  // what made the window lag behind the pointer on Windows 10.
  $("dragZone").addEventListener("mousedown", (event) => {
    if (event.button !== 0) return;
    dragging = true;
    invoke("begin_drag").catch(() => appWindow.startDragging());
    setTimeout(() => { dragging = false; }, 500);
  });

  $("tbMin").addEventListener("click", () => appWindow.minimize());
  $("tbClose").addEventListener("click", () => appWindow.close());

  // ---------------------------------------------------------------- pairing
  function pairingView() {
    const block = state?.pairing || "";
    if (!block || keyVisible) return block;
    return block.replace(/key=([0-9a-f]{4})[0-9a-f]+([0-9a-f]{4})/i, "key=$1••••••••••••$2");
  }

  async function copyText(text, message) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (error) {
      const helper = document.createElement("textarea");
      helper.value = text;
      helper.style.position = "fixed";
      helper.style.opacity = "0";
      document.body.appendChild(helper);
      helper.select();
      document.execCommand("copy");
      helper.remove();
    }
    toast(message);
  }

  $("copyBtn").addEventListener("click", async () => {
    try {
      const bundle = await invoke("pairing_bundle");
      await copyText(bundle, "Скопировано: ключ + промпт — вставьте в чат");
    } catch (error) {
      await copyText(state?.pairing || "", "Скопирован только ключ");
    }
  });

  $("copyKeyBtn").addEventListener("click", () =>
    copyText(state?.pairing || "", "Скопирован только блок ключа"));

  $("revealBtn").addEventListener("click", () => {
    keyVisible = !keyVisible;
    $("pairing").value = pairingView();
    $("revealBtn").textContent = keyVisible ? "Скрыть ключ" : "Показать ключ";
  });

  $("rotateBtn").addEventListener("click", async () => {
    if (!confirm("Сгенерировать новый ключ? Старый мгновенно перестанет работать.")) return;
    await invoke("rotate_key");
    toast("Новый ключ создан, старый отозван");
    refreshState();
  });

  $("tunnelBtn").addEventListener("click", async () => {
    await invoke("restart_tunnel");
    toast("Туннель перезапускается…");
    refreshState();
  });

  // ---------------------------------------------------------------- state
  function renderState(next) {
    if (!next) return;
    state = next;
    $("pairing").value = pairingView();
    $("revealBtn").textContent = keyVisible ? "Скрыть ключ" : "Показать ключ";

    const tunnelHost = (next.tunnel_url || "").replace(/^https?:\/\//, "");
    $("sTunnel").textContent = tunnelHost || "нет связи";
    $("sTunnel").title = next.tunnel_url || "туннель ещё не поднялся";
    $("sTunnel").style.color = next.tunnel_url ? "var(--green)" : "var(--red)";
    $("sPort").textContent = next.port ? `127.0.0.1:${next.port}` : "—";
    $("sUptime").textContent = formatUptime(next.uptime_seconds);

    $("agentDot").className = "dot " + (next.active ? "on" : "off");
    $("agentLabel").textContent = next.active ? "агент активен" : "пауза";
    $("pauseBtn").textContent = next.active ? "Пауза" : "Продолжить";

    const chip = $("stageChip");
    if (next.stage) {
      chip.hidden = false;
      $("stageLabel").textContent = next.stage;
      chip.title = next.stage;
    } else {
      chip.hidden = true;
    }

    $("tunnelDot").className = "dot " + (next.tunnel_url ? "on" : "wait");
    $("tunnelLabel").textContent = next.tunnel_url ? "туннель готов" : "поднимаю туннель";
  }

  const GLYPH = {
    stage: "▸",
    step: "→",
    result: "✓",
    error: "✕",
    note: "·",
    shell: "$",
    gui: "⌘",
    tunnel: "≈",
    ui: "◌",
    key: "⚿",
    admin: "!",
    agent: "•",
    relay: "≈",
  };

  // Entries are capped so a runaway command cannot wreck the panel layout.
  const ENTRY_CHARS = 1200;
  const ENTRY_LONG = 110;

  function entryHtml(entry) {
    const clock = String(entry.time || "").slice(11); // HH:MM:SS
    const glyph = GLYPH[entry.kind] || "·";
    let text = String(entry.text ?? "");
    if (text.length > ENTRY_CHARS) text = text.slice(0, ENTRY_CHARS) + " …";
    const classes = ["entry", entry.kind];
    if (text.length > ENTRY_LONG || text.includes("\n")) classes.push("long");
    return `<div class="${classes.map(escapeHtml).join(" ")}" title="${escapeHtml(text)}">
      <span class="t">${escapeHtml(clock)}</span>
      <span class="g">${escapeHtml(glyph)}</span>
      <span class="m">${escapeHtml(text)}</span>
    </div>`;
  }

  function renderJournal() {
    const box = $("journal");
    box.innerHTML = journalEntries.map(entryHtml).join("");
    box.scrollTop = box.scrollHeight;
  }

  function appendEntry(entry) {
    if (!entry) return;
    journalEntries.push(entry);
    if (journalEntries.length > 400) journalEntries = journalEntries.slice(-300);
    renderJournal();
  }

  async function refreshState() {
    if (dragging) return; // do not repaint the UI while the window is being moved
    try {
      renderState(await invoke("snapshot"));
    } catch (error) { /* окно ещё поднимается */ }
  }

  async function loadJournal() {
    try {
      journalEntries = await invoke("journal_tail", { limit: 250 });
      renderJournal();
    } catch (error) { /* журнал появится позже */ }
  }

  $("pauseBtn").addEventListener("click", async () => {
    await invoke("set_active", { active: !(state?.active ?? true) });
    refreshState();
  });

  $("shotBtn").addEventListener("click", async () => {
    try {
      const base64 = await invoke("screenshot");
      $("shotImg").src = "data:image/jpeg;base64," + base64;
      $("shotWrap").classList.add("show");
      toast("Скриншот снят");
    } catch (error) {
      toast("Скриншот не удался: " + error);
    }
  });

  $("folderBtn").addEventListener("click", () => invoke("open_data_dir"));
  $("quitBtn").addEventListener("click", () => {
    if (confirm("Закрыть PC-Bridge полностью? Мост перестанет работать.")) invoke("quit");
  });

  listen("journal", (event) => appendEntry(event.payload));
  listen("state", (event) => renderState(event.payload));
  listen("tunnel", () => refreshState());

  refreshState();
  loadJournal();
  setInterval(refreshState, 3000);

  // Watchdog: a crashed or half-painted renderer leaves a stale frame. If the bridge
  // stops answering for a while, reload the page instead of showing broken UI.
  let failures = 0;
  setInterval(async () => {
    try {
      await invoke("snapshot");
      failures = 0;
    } catch (error) {
      failures += 1;
      if (failures >= 5) location.reload();
    }
  }, 4000);
</script>
</body>
</html>
