name: windows

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  # No `pull_request` trigger: the repository is public and read-only, so an outside PR
  # must not be able to burn Windows runner minutes. Builds run on our own pushes only.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (windows-latest, x64)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Clippy (informational)
        continue-on-error: true
        run: cargo clippy --release --manifest-path src-tauri/Cargo.toml -- -W clippy::all

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build single-file executable
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Report artifact size
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/pc-bridge.exe"
          $size = (Get-Item $exe).Length / 1MB
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $line = "pc-bridge.exe — {0:N1} MB" -f $size
          $line
          "sha256 $hash"
          $summary = "### pc-bridge.exe`n`nsize: {0:N1} MB`n`nsha256: ``{1}``" -f $size, $hash
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: pc-bridge-windows-x64
          path: src-tauri/target/release/pc-bridge.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/pc-bridge.exe
          generate_release_notes: true
