[package]
name = "pc-bridge"
version = "2.3.1"
description = "PC-Bridge — remote control bridge for your own Windows PC"
authors = ["oleksander17072012-a11y"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
axum = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
